# Every hour: STK's public keys, read from production (GET /v1/rules?keys=1, no key, no secret), added to keys.json.
# Append-only: a key once in it stays; only a key made invalid gets its note. A push publishes it with the site.
name: keys-copy
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: keys-copy
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the public keys
        run: |
          r=$(python3 scripts/keys_copy.py)
          echo "result: $r"
          if [ "$r" = changed ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keys.json && git commit -qm "keys.json: public keys copied (append-only)" && git push -q
          fi
