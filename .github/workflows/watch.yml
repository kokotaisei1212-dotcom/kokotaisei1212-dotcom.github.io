# STK's own watch (CEO 2026-11-18): every hour, api.stk-evidence.com/v1/health must say ok true. When it says false,
# or does not answer, this run fails and GitHub emails the repository's owner. ok false stands for: no published
# signing key for today, fewer than 3 days of published keys ahead (in Stripe or in this site's keys.json), the
# clock 3 seconds off Stripe's, a second unexpected stop of the server in 250 days (for 24 hours after it), the unpaid state not read, a month's close not done, and the other problems the admin
# health lists. Nothing secret is here: the public answer only.
name: watch
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "1 = fail on purpose once, to see the email arrive"
        default: "0"
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /v1/health says ok true
        env:
          TEST: ${{ github.event.inputs.test || '0' }}
        run: |
          for i in 1 2 3; do
            body=$(curl -s -m 30 https://api.stk-evidence.com/v1/health || true)
            echo "$body" | grep -q '"ok":true' && [ "$TEST" != "1" ] && { echo "ok"; exit 0; }
            sleep 60
          done
          echo "::error::STK /v1/health is not ok: ${body:-no answer}${TEST:+ (test=$TEST)}"
          exit 1
